name: CrediWise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & PostgreSQL Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crediwise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Upgrade pip and Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify ML Model Artifact Existence
        run: |
          if [ ! -f "ml/models/loan_model_v2.joblib" ]; then
            echo "ERROR: Certified production ML model artifact ml/models/loan_model_v2.joblib is missing!"
            exit 1
          fi
          echo "Verified certified model artifact is present."

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+psycopg://postgres:test_password@localhost:5432/crediwise_test
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
          MODEL_PATH: ml/models/loan_model_v2.joblib
          MODEL_VERSION: loan-model-v2.1-synthetic-10000
          DEFAULT_CURRENCY: INR
          CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
        run: |
          export SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          python -m pytest backend/app/tests -v

  frontend-build:
    name: Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies (npm ci)
        run: npm ci

      - name: Run Frontend Production Build (Typecheck + Vite Build)
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
